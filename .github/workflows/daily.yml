name: daily-lottery
on:
  schedule:
    - cron: "*/15 16-20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to fetch, YYYY-MM-DD (leave empty = tonight's results)"
        required: false
permissions:
  contents: write
concurrency:
  group: daily-lottery
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_DATE: ${{ github.event.inputs.date }}
    steps:
      - uses: actions/checkout@v4
      - id: pre
        name: Quick check (inside window and not done yet?)
        run: python3 robot/robot.py --precheck
      - uses: actions/setup-python@v5
        if: steps.pre.outputs.run == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: robot/requirements.txt }
      - name: Install
        if: steps.pre.outputs.run == 'true'
        run: |
          pip install -r robot/requirements.txt
          pip uninstall -y opencv-python && pip install opencv-python-headless
          python -m playwright install --with-deps chromium
      - name: Find results, build PDF, notify
        if: steps.pre.outputs.run == 'true'
        run: python robot/robot.py
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID: ${{ secrets.WA_PHONE_ID }}
          WA_TO: ${{ secrets.WA_TO }}
          WA_TEMPLATE: ${{ secrets.WA_TEMPLATE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Publish (commit -> Vercel redeploys)
        if: steps.pre.outputs.run == 'true'
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add site/results
          git diff --cached --quiet || (git commit -m "results $(date -u +%F)" && git pull --rebase && git push)
