name: Fetch lottery results

on:
  schedule:
    - cron: "20 */3 * * *"        # every 3 hours (UTC). Change if you like.
  workflow_dispatch:
    inputs:
      dates:
        description: "Dates to fetch, e.g. 2026-10-03,2026-10-01 (empty = last 3 days)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: fetch-results
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetcher/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r fetcher/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Fetch results
        env:
          FB_STORAGE_STATE: ${{ secrets.FB_STORAGE_STATE }}
          INPUT_DATES: ${{ github.event.inputs.dates }}
        run: |
          ARGS="--days 3"
          if [ -n "$INPUT_DATES" ]; then ARGS="--dates $INPUT_DATES"; fi
          if [ -n "$FB_STORAGE_STATE" ]; then
            printf '%s' "$FB_STORAGE_STATE" > fetcher/state.json
            ARGS="$ARGS --storage-state fetcher/state.json"
          fi
          python fetcher/fetch_results.py $ARGS
          rm -f fetcher/state.json

      - name: Save new images
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Add lottery results"
            git pull --rebase
            git push
          fi
